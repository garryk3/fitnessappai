name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fitnessappai
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Static analysis (analyzer plugins)
        # Гарантированная точка проверки запрета сырых Material-виджетов
        # (restrict_raw_flutter, этап 52). `flutter analyze` показывает такую
        # диагностику не на всех версиях (3.47.4 — не показывает, 3.47.7 в CI —
        # показывает; проверено 2026-10-12), поэтому дублирующий шаг обязателен.
        # ВАЖНО: путь передавать НЕЛЬЗЯ — `dart analyze lib` плагины не грузит
        # вообще (проверено 2026-10-12: 0 диагностик вместо 703), поэтому гейт
        # идёт по всему пакету, а `test/` и `integration_test/` покрыты
        # `// ignore_for_file: type=lint`.
        run: dart analyze --fatal-infos

      - name: Guard uikit exemptions
        # `// ignore_for_file: type=lint` — это же и лазейка в обход запрета.
        # Разрешаем её только в `lib/uikit/**` и `lib/app/theme/**`;
        # generated-файлы (*.g.dart, l10n) исключены так же, как в analysis_options.
        run: |
          violations=$(git grep -n "ignore_for_file:.*type=lint" -- lib ':!lib/uikit' ':!lib/app/theme' ':!*.g.dart' ':!*.freezed.dart' ':!*.mocks.dart' ':!lib/l10n' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Подавление '// ignore_for_file: type=lint' разрешено только в lib/uikit/** и lib/app/theme/**"
            exit 1
          fi

      - name: Guard raw interactive widgets
        # Этап 56: сырые интерактивные M3-виджеты/функции вне uikit запрещены —
        # обязательны обёртки lib/uikit (AppDialog, AppButton, AppListTile, …).
        # Разрешённые зоны: lib/uikit/**(реализация), lib/app/theme/**, test/**,
        # integration_test/**; generated-файлы (*.g.dart, l10n) исключены всегда.
        # Список идентификаторов сопровождается здесь же (word-boundary \b).
        run: |
          pattern='\b(AlertDialog|SnackBar|FilledButton|IconButton|ListTile|SwitchListTile|CheckboxListTile|DropdownButton|DropdownButtonFormField|DropdownMenuItem|FloatingActionButton|CircularProgressIndicator|LinearProgressIndicator|RefreshIndicator|Divider|VerticalDivider|Chip|Tooltip|Checkbox|Switch|Drawer|PopupMenuButton|PopupMenuItem|showDialog|showModalBottomSheet)\b'
          violations=$(git grep -nE "$pattern" -- lib ':!lib/uikit' ':!lib/app/theme' ':!*.g.dart' ':!*.freezed.dart' ':!*.mocks.dart' ':!lib/l10n' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Сырые интерактивные M3-виджеты вне lib/uikit запрещены — используйте обёртки lib/uikit (этап 56)"
            exit 1
          fi

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: fitnessappai/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
