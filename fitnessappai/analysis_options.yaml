include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/l10n/*.dart"
    - build/**
    - android/**
    - web/**
    - linux/**

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    always_use_package_imports: true
