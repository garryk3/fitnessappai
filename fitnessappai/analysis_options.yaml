include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/l10n/*.dart"
    - build/**
    - android/**
    - web/**
    - linux/**

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    always_use_package_imports: true

# Этап 52: запрет сырых Material-виджетов вне lib/uikit/.
#
# Внешний виджет собирается только из компонентов lib/uikit/. Правила ниже
# включаются по одному по мере миграции (см. PLAN.md, этап 52), чтобы CI
# оставался зелёным на каждом шаге.
#
# ВАЖНО: гейт — `dart analyze --fatal-infos` по всему пакету (без путей).
# Проверенные ловушки (2026-10-11/12):
#   * `dart analyze <path>` (напр. `dart analyze lib`) плагины НЕ грузит вообще
#     — 0 диагностик вместо 703; путь аргументом передавать нельзя;
#   * `exclude_for_plugin` не поддерживается, `--options` у `dart analyze` нет;
#   * `flutter analyze` диагностику плагина показывает не на всех версиях
#     (Flutter 3.47.4 — не показывает, 3.47.7 в CI — показывает), поэтому
#     в CI есть и шаг `dart analyze --fatal-infos`, и `flutter analyze`.
# Поэтому гейт идёт по всему пакету, а исключённые каталоги подавлены в файлах.
#
# Точки, где сырые виджеты разрешены (подавление `// ignore_for_file: type=lint`):
#   lib/uikit/**            — здесь и живут обёртки;
#   lib/app/theme/**        — дизайн-токены (seed, ChartSeriesColors, chartGrid);
#   test/**, integration_test/** — тестовые фикстуры.
# В любом другом файле `lib/` подавление запрещено (CI-шаг «Guard uikit exemptions»).
# NB: `type=lint` глушит только lint-правила этих файлов; предупреждения
# (unused_import, unused_local_variable и т.п.) и ошибки по-прежнему видны.
plugins:
  restrict_raw_flutter:
    # Вендорный форк (62.2): pub-версия 0.2.2 несовместима с SDK 3.14
    # (analysis_server_plugin >=0.3.21 в генераторе SDK против <0.3.15 у
    # плагина — синтетический pub upgrade падает, плагин молча не грузится)
    # и не матчит импорты package:material_ui (миграция 62.1). Форк лежит в
    # vendor/restrict_raw_flutter (обновлённые зависимости + матчинг
    # material_ui); upstream: github.com/SoutaTanaka/restrict_raw_flutter.
    path: vendor/restrict_raw_flutter
    diagnostics:
      ban_text_widget: true
      ban_icon_widget: true
      ban_container_widget: true
      ban_card_widget: true
      ban_scaffold_widget: true
      ban_appbar_widget: true
      ban_listview_widget: true
      ban_gridview_widget: true
      ban_image_widget: true
      ban_textfield_widget: true
      ban_textformfield_widget: true
      ban_elevated_button_widget: true
      ban_text_button_widget: true
      ban_outlined_button_widget: true
      ban_colors: true
      ban_color: true
      ban_inkwell_widget: true
      ban_gesture_detector_widget: true
